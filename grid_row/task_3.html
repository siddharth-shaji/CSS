<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         .container {
            display: grid;
            grid-template-columns: repeat(2, 200px);
            grid-template-rows: repeat(2, 150px);

            /*
            align-content: space-around;
            justify-content: space-between;
            */

            place-content: start;
            align-items: center;
            justify-items: end;
            place-items: stretch;
            gap: 5px;
            align-self: end;
            justify-self: end;
            place-self: stretch;
        }

        .content {
/*             
            height: 100px;
            width: 100px;
            */
            background-color: rgb(165, 94, 177);
        }
        .one{
            grid-row: 1/3;
        }
        /* .two{
            grid-column: 2/3;
            
        }
        .four{
            grid-column: 2/3;
        } */


    </style>
</head>
<body>

    <div class="container">
        <div class="content one">1</div>
        <div class="content two" >2</div>
        <!-- <div class="content three">3</div> -->
        <div class="content four">4</div>

    </div>
</body>
</html>
