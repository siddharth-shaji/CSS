
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(2, 200px);
            grid-template-rows: repeat(4, 150px);

            /*
            align-content: space-around;
            justify-content: space-between;
            */

            place-content: start;
            align-items: center;
            justify-items: end;
            place-items: stretch;
            gap: 5px;
        }

        .content {
            /*
            height: 100px;
            width: 100px;
            */
            background-color: rgb(165, 94, 177);
        }

        .last {
            align-self: end;
            justify-self: end;
            place-self: stretch;

            grid-column-start: 1;   /*one way  */
            grid-column-end: 3;    /* It'sthe other  */

            grid-column: 1/3;
        }

        .one {
            grid-row: 1/3;
            place-self: stretch;
        }

        .four {
            grid-row: 2/4;
            place-self: stretch;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="content one">1</div>
        <div class="content">2</div>
        <div class="content four">4</div>
        <div class="content">5</div>
        <div class="content last">7</div>
    </div>
</body>
</html>
