<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(4, 200px);
            grid-template-rows: repeat(4, 150px);

            /*
            align-content: space-around;
            justify-content: space-between;
            */

            place-content: start;
            align-items: center;
            justify-items: end;
            place-items: stretch;
            gap: 5px;
            align-self: end;
            justify-self: end;
            place-self: stretch;
        }
        .content {
/*             
            height: 100px;
            width: 100px;
            */
            background-color: rgb(165, 94, 177);
        }
        .one{
            grid-column: 1/3;
            grid-row: 1/5;
        }




    </style>
</head>
<body>

     <div class="container">
        <div class="content one">1</div>
        <div class="content two" >2</div>

        <div class="content therteen">13</div>
        <div class="content fourteen">14</div> 
        <div class="content fifteen">15</div>
        <div class="content sixteen">16</div>

    </div>
    
</body>
</html>
