<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            background-color:violet;   /*universal selector */
        }
        h2{
            color: aquamarine;   /*element selector */
        }
        .ho{
            color: blue;    /*class selector */
        }
        #header{
            color: red;  /*id selector */
        }
        h3,p{
            color: blueviolet;   /*group selector */
        }
    </style>
</head>
<body>
    <h1 id="header">Lorem ipsum .</h1>
    <h2>Lorem, ipsum dolor hello me.</h2>
    <h1 class="ho">Lorem ipsum dolor sit.</h1>
    <p class="ho">Lorem ipsum dolor sit amet consectetur.</p>
    <p>Lorem ipsum dolor sit amet consectetur.</p>
    <h3>Lorem ipsum dolor sit.</h3>
</body>
</html>
